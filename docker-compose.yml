
services:
  backend:
    build: ./backend/fileserver
    container_name: backend
    ports:
      - "8080:8080"
    volumes:
      - ./files:/app/files
    networks:
      - app-net
      
      
  frontend:
    build: ./frontend/react-file-download
    container_name: frontend
    networks:
      - app-net      
  
  
  
  nginx:
    imgae: nginx:latest
    container_name: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"   # React + Nginx inside one container
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-net
      
      
  certbot:
    imgae: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  app-net:
    driver: bridge
