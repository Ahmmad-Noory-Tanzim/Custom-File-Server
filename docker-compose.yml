services:
  # ---------------- Backend Service ----------------
  backend:
    build: ./backend/fileserver
    container_name: backend
    networks:
      - app-net
    expose:
      - "8080"  # internal only
    restart: unless-stopped

  # ---------------- Frontend Service ----------------
  frontend:
    build: ./frontend/react-file-download
    container_name: frontend
    networks:
      - app-net
    expose:
      - "80"  # internal only
    restart: unless-stopped

  # ---------------- Nginx Gateway ----------------
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - frontend
      - backend
    networks:
      - app-net
    ports:
      - "80:80"    # optional if Cloudflare Tunnel handles HTTPS
      - "443:443"  # optional if Cloudflare Tunnel handles HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # ---------------- Cloudflared Tunnel ----------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    depends_on:
      - nginx
    networks:
      - app-net
    command: tunnel run myapp
    volumes:
      - /home/starpc/.cloudflared:/etc/cloudflared:ro  # contains config.yml, cert.pem, tunnel.json
    restart: unless-stopped

# ---------------- Docker Network ----------------
networks:
  app-net:
    driver: bridge
